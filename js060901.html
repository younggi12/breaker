<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>드로잉 앱</title>
    <link rel="stylesheet" href="./reset.css">

    <style>
        #container{
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #toolbar{
            width: 100%;
            min-height: 70px;
            background-color: darkblue;

            display: flex;
            flex-wrap: wrap;            /* [추가] 좁은 화면에서 줄바꿈 */
            justify-content: space-around;
            align-items: center;
            gap: 10px;
            padding: 8px 0;
        }

        #toolbar div *{
            color: white;
            font-weight: bold;
            font-size: 20px;
            margin-right: 10px;
        }

        #toolbar input{
            color : black;
        }

        #bc{
            color: white;
            font-weight: bold;
            font-size: 20px;
        }

        #bc button{
            border: none;
            background-color: burlywood;
            border-radius: 50%;
            color: white;
            padding: 5px 30px;
            cursor: pointer;
        }

        #bc button:disabled{
            opacity: 0.4;
            cursor: default;
        }

        canvas{
            display: block;
            background-color: #ffffff;   /* [수정] 기본 배경을 흰색으로 명시 */
            touch-action: none;          /* [추가] 터치로 그릴 때 화면이 스크롤되지 않게 */
            cursor: crosshair;
        }
    </style>

</head>
<body>

    <div id="container">
        <div id="toolbar">
            <div>
                <label for="strokeColor">색상</label>
                <input type="color" id="strokeColor" value="#000000" />

                <label for="lwidth">선 굵기</label>
                <input type="number" id="lwidth" value="2" min="1" max="50" />
            </div>

            <div id="bc">
                <label for="fillColor">배경색</label>
                <!-- [수정] 기본값을 흰색으로. 검정이면 기본 펜(검정)으로 그린 그림이 다운로드 시 안 보였다 -->
                <input type="color" id="fillColor" value="#ffffff"/>

                <button id="undo" disabled>되돌리기</button>  <!-- [추가] -->
                <button id="reset">지우기</button>
                <button id="downfile">다운로드</button>
            </div>

        </div>

        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.querySelector("canvas")
        const toolbar = document.getElementById("toolbar")
        const bc = document.getElementById("fillColor")
        const undoBtn = document.getElementById("undo")

        let isDrawing = false;
        let lineWidth = 2;

        // [수정] 화면의 캔버스 배경(흰색)과 같은 값으로 시작
        let bgColor = "#ffffff";

        const ctx = canvas.getContext("2d")

        // [수정] 펜 색을 변수로 따로 보관
        // 캔버스 크기를 바꾸면 ctx 설정(strokeStyle 등)이 초기화되기 때문에 다시 적용할 값이 필요하다
        let strokeColor = "#000000";
        ctx.strokeStyle = strokeColor;

        // [추가] 되돌리기용 기록 — 한 획을 시작하기 직전의 그림을 저장해 둔다
        const MAX_HISTORY = 20
        let history = []

        function saveHistory(){
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height))
            if(history.length > MAX_HISTORY){
                history.shift()   // 오래된 기록부터 버려 메모리를 아낀다
            }
            undoBtn.disabled = false
        }

        function undo(){
            if(history.length === 0) return
            ctx.putImageData(history.pop(), 0, 0)
            undoBtn.disabled = history.length === 0
        }

        // [추가] 창 크기에 맞춰 캔버스 크기 다시 맞추기
        // 기존에는 페이지를 열 때 한 번만 크기를 정해서, 그 뒤 창을 키우거나
        // 개발자 도구를 닫으면 캔버스가 화면보다 작게 남아 아래쪽이 그려지지 않았다
        function resizeCanvas(){
            const newWidth = window.innerWidth
            const newHeight = window.innerHeight - toolbar.offsetHeight
            if(newWidth === canvas.width && newHeight === canvas.height) return

            // 1) 지금까지 그린 그림을 임시 캔버스에 복사해 두고
            const prev = document.createElement("canvas")
            prev.width = canvas.width
            prev.height = canvas.height
            prev.getContext("2d").drawImage(canvas, 0, 0)

            // 2) 크기를 바꾼 뒤 (이 순간 캔버스 내용과 설정이 모두 지워진다)
            canvas.width = newWidth
            canvas.height = newHeight

            // 3) 그림과 펜 색을 다시 적용
            ctx.drawImage(prev, 0, 0)
            ctx.strokeStyle = strokeColor

            // 크기가 다른 예전 기록은 되돌리기에 쓸 수 없으므로 비운다
            history = []
            undoBtn.disabled = true
        }

        resizeCanvas()
        window.addEventListener("resize", resizeCanvas)

        // [추가] 화면 좌표 → 캔버스 좌표
        // 기존에는 clientY에서 캔버스 위치만 뺐는데, 스크롤하거나 캔버스 왼쪽에 여백이 생기면 어긋났다
        function getPos(e){
            const rect = canvas.getBoundingClientRect()
            return {
                x: (e.clientX - rect.left) * (canvas.width / rect.width),
                y: (e.clientY - rect.top) * (canvas.height / rect.height)
            }
        }

        // 선색상, 선굵기 변경 이벤트
        toolbar.addEventListener("change", function(e){
            if(e.target.id === "strokeColor"){
                strokeColor = e.target.value;   // [수정] 변수에도 저장
                ctx.strokeStyle = strokeColor;
            }

            if(e.target.id === 'lwidth'){
                lineWidth = Number(e.target.value);
            }
        })

        // [수정] mouse 이벤트 → pointer 이벤트
        // pointer 이벤트 하나로 마우스 · 터치 · 펜을 모두 처리할 수 있어 휴대폰에서도 그려진다
        canvas.addEventListener("pointerdown", function(e){
            saveHistory()   // [추가] 그리기 전 상태 저장
            isDrawing = true;
            canvas.setPointerCapture(e.pointerId)   // 캔버스 밖으로 나가도 획이 끊기지 않게

            const { x, y } = getPos(e)
            ctx.beginPath();
            ctx.moveTo(x, y);

            // [추가] 클릭만 해도 점이 찍히게
            ctx.lineWidth = lineWidth
            ctx.lineCap = 'round'
            ctx.lineTo(x, y)
            ctx.stroke()
        })

        canvas.addEventListener("pointermove", function(e){
            if(!isDrawing) return
            const { x, y } = getPos(e)
            ctx.lineWidth = lineWidth
            ctx.lineCap = 'round'
            ctx.lineJoin = 'round'
            ctx.lineTo(x, y)
            ctx.stroke()
        })

        function stopDrawing(){
            isDrawing = false
            ctx.beginPath()
        }

        canvas.addEventListener("pointerup", stopDrawing)
        canvas.addEventListener("pointercancel", stopDrawing)

        // 버튼 이벤트 (되돌리기 · 지우기 · 다운로드)
        toolbar.addEventListener("click", function(e){
            // [추가] 되돌리기
            if(e.target.id === "undo"){
                undo()
            }

            // 지우기
            if(e.target.id === "reset"){
                saveHistory()   // [추가] 지운 것도 되돌릴 수 있게
                ctx.clearRect(0, 0, canvas.width, canvas.height)
            }

            // 캔버스에 그린 그림 다운로드
            // 캔버스 자체는 투명하고 배경색은 CSS로만 칠해져 있어서,
            // 임시 캔버스에 배경색을 먼저 칠하고 그 위에 그림을 합쳐서 저장한다
            if(e.target.id === "downfile"){
                const tempCanvas = document.createElement("canvas");
                const tempCtx = tempCanvas.getContext("2d");

                tempCanvas.width = canvas.width;
                tempCanvas.height = canvas.height;

                tempCtx.fillStyle = bgColor;
                tempCtx.fillRect(0, 0, tempCanvas.width, tempCanvas.height);

                tempCtx.drawImage(canvas, 0, 0);

                let link = document.createElement("a");
                link.download = "drawing.png";
                link.href = tempCanvas.toDataURL("image/png");
                link.click();
            }
        })

        // [추가] Ctrl + Z (Mac은 Cmd + Z)로 되돌리기
        window.addEventListener("keydown", function(e){
            if((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z"){
                e.preventDefault()
                undo()
            }
        })

        // 배경색 변경
        bc.addEventListener("change", function(){
            bgColor = this.value;
            canvas.style.backgroundColor = bgColor;
        })
    </script>
</body>
</html>
